[package]
name = "tmpmail"
version = "2.0.0"
edition = "2024"
rust-version = "1.85"
description = "Fast multi-backend temporary email CLI"
license = "MIT"
repository = "https://github.com/sealad886/tmpmail"

[workspace]
members = ["."]
resolver = "3"

[dependencies]
clap = { version = "4.5", default-features = false, features = ["derive", "error-context", "help", "std", "suggestions", "usage"] }
fs2 = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
panic = "abort"
strip = "symbols"

[profile.bench]
inherits = "release"
