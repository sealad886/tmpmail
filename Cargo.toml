[package]
name = "tmpmail"
version = "2.0.0"
edition = "2024"
rust-version = "1.88"
description = "Fast multi-backend temporary email CLI"
license = "MIT"
repository = "https://github.com/sealad886/tmpmail"

[workspace]
members = ["."]
resolver = "3"

[features]
default = ["native-keyring"]
native-keyring = ["dep:keyring"]

[dependencies]
clap = { version = "4.5", default-features = false, features = ["derive", "error-context", "help", "std", "suggestions", "usage"] }
fs2 = "0.4"
futures-util = "0.3"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt", "signal", "time"] }
toml = "0.9"

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "4.1", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
libloading = "0.8"

[dev-dependencies]
clap_complete = "4.5"
tempfile = "3"

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = "z"
panic = "abort"
strip = "symbols"

[profile.bench]
inherits = "release"
