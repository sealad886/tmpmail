name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  dependency-policy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@v2.1.1
        with:
          command: check advisories bans licenses sources

  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install Rust 1.88
        run: rustup toolchain install 1.88.0 --profile minimal --component clippy,rustfmt
      - run: rustup override set 1.88.0
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --all-targets --locked
      - run: cargo metadata --locked --no-deps --format-version 1 >/dev/null
      - run: ./scripts/validate-docs.sh
      - run: ./scripts/check-completions.sh

  native-release-build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install Rust 1.88
        run: rustup toolchain install 1.88.0 --profile minimal
      - run: rustup override set 1.88.0
      - run: ./scripts/package.sh ${{ matrix.target }}
      - run: ./scripts/validate-package.sh dist/tmpmail-2.0.0-${{ matrix.target }}.tar.gz
      - run: ./scripts/check-reproducible-package.sh ${{ matrix.target }}
      - uses: actions/upload-artifact@v7
        with:
          name: tmpmail-${{ matrix.target }}
          path: dist/tmpmail-2.0.0-${{ matrix.target }}.*
          if-no-files-found: error
